[project]
name = "trace-marketplace"
version = "0.1.0"
description = "Failure-mode search engine for coding-agent traces."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "harbor>=0.6.6",
    "huggingface-hub>=0.24.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trace_marketplace"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
