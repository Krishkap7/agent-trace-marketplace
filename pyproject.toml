[project]
name = "trace-marketplace"
version = "0.1.0"
description = "Failure-mode search engine for coding-agent traces."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0,<1.0",
    "harbor>=0.6.6",
    "huggingface-hub>=0.24.0",
    # numpy is a transitive of pyarrow today, but slice 6's vector NN
    # primitive (search/similar.py) calls into numpy directly so we
    # pin it explicitly. The major version is bounded so a numpy 3.x
    # release can't silently break the cosine-similarity dot product.
    "numpy>=2.0,<3.0",
    # OpenAI client for text-embedding-3-small. Slice 6's embeddings
    # pass + the NL-query semantic-intent embedding both go through
    # this SDK. Range is widened to <3.0 because harbor transitively
    # requires openai 2.x via litellm; the embeddings.create API is
    # stable across the 1.x -> 2.x boundary so this is safe.
    "openai>=1.50,<3.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.40,<2.0",
    # watchdog backs scripts/auto_upload.py (filesystem observer for
    # ~/.claude/projects and ~/.codex/sessions). 4.x is the current
    # stable line; the FileSystemEventHandler / Observer / event APIs
    # we use are unchanged since 3.x so the upper bound is just guard-
    # railing a hypothetical 5.x refactor.
    "watchdog>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trace_marketplace"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
